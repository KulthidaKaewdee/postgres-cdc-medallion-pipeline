x-aws-common: &env-aws
    AWS_ACCESS_KEY_ID: minioadmin        # Access Key สำหรับเชื่อม Spark ไปยัง MinIO (S3-compatible)
    AWS_SECRET_ACCESS_KEY: miniopassword # Secret Key คู่กับ Access Key สำหรับยืนยันตัวตน
    AWS_REGION: us-east-1                # Region แบบหลอกเพื่อให้ AWS SDK ทำงานได้ (MinIO ไม่ได้ใช้จริง)

# Common config สำหรับ Spark Bronze
x-spark-bronze-common: &spark-bronze-common
  image: spark-custom:3.5.1
  build:
    context: ./spark-image
    dockerfile: Dockerfile
  depends_on:
    - spark-master
    - kafka-connect
    - minio
  volumes:
    - ./spark/jobs:/opt/spark/jobs

  environment:
    - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
    - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
    - MINIO_URL=http://minio:9000

  restart: always

services:
  zookeeper:
  # ZooKeeper เอาไว้จัดการ metadata และประสานงาน (coordination) ระหว่าง Kafka broker
    image: confluentinc/cp-zookeeper:7.7.7
    hostname: zookeeper                      # hostname ภายใน Docker network
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181 # พอร์ตที่ ZooKeeper เปิดให้ client (เช่น Kafka broker) เชื่อมต่อ
      ZOOKEEPER_TICK_TIME: 2000 # หน่วยเวลาพื้นฐานของ ZooKeeper (มิลลิวินาที) ใช้กำหนด timeout ต่าง ๆ -> 2000 = 2 วิ
    networks:
      - default # ใช้ network ค่าเริ่มต้นของ Docker Compose (bridge network) เพื่อให้ container ใน compose เดียวกันสื่อสารกันได้
    restart: always

  broker:
  # Kafka broker: ตัวกลางรับ-ส่งและจัดเก็บ message ระหว่าง producer และ consumer
    image: confluentinc/cp-server:7.7.7   # Docker image ของ Confluent Kafka Server
    hostname: broker                      # hostname ภายใน Docker network
    container_name: broker                # ชื่อ container
    depends_on:
      - zookeeper                         # ให้ broker เริ่มหลัง zookeeper
    ports:
      - "9092:9092"                       # พอร์ตสำหรับ client เชื่อมต่อจาก host
      - "9101:9101"                       # พอร์ต JMX สำหรับ monitoring
    volumes:
      - cdc_mel_kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1                  # ID ประจำตัว broker (ต้องไม่ซ้ำ)
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181" # ที่อยู่ ZooKeeper สำหรับเก็บ metadata
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT # map ชื่อ listener กับ protocol
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://broker:9092 # address ที่ client ใช้ connect -> 29092 ใช้ ภายใน Docker network, 9092 ใช้จาก เครื่อง host ภายนอก
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092 # พอร์ตที่ broker เปิดรอฟัง
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 # replication factor ของ consumer offsets
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # ไม่หน่วงเวลาการ rebalance consumer group
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1 # replication factor ของ license topic
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1 # replication factor ของ balancer topic
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1 # จำนวน replica ขั้นต่ำที่ต้องพร้อมสำหรับ transaction
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 # replication factor ของ transaction log
      KAFKA_JMX_PORT: 9101                 # พอร์ต JMX
      KAFKA_JMX_HOSTNAME: localhost        # hostname สำหรับ JMX
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081 # URL ของ Schema Registry
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker:29092 # broker ที่ใช้ส่ง metrics
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1 # replication factor ของ metrics topic
      CONFLUENT_METRICS_ENABLE: "true"     # เปิดใช้งาน metrics
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous" # ID สำหรับ support (anonymous)
    networks:
      - default                            # ใช้ Docker Compose default network
    restart: always

  schema-registry:
    # Schema Registry: เก็บและจัดการ schema (เช่น Avro / JSON Schema / Protobuf)
    image: confluentinc/cp-schema-registry:8.0.3   # Docker image ของ Schema Registry
    hostname: schema-registry                     # hostname ภายใน Docker network
    container_name: schema-registry               # ชื่อ container
    depends_on:
      - broker                                    # เริ่มหลัง Kafka broker
    ports:
      - "18081:8081"                               # พอร์ตให้ client เรียกใช้งาน Schema Registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry  # ชื่อ host ที่ Schema Registry ประกาศตัวเอง
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092' # Kafka broker ที่ใช้เก็บ schema
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081 # ที่อยู่และพอร์ตที่เปิดให้เรียกใช้งาน
    networks:
      - default                                   # ใช้ Docker Compose default network
    restart: always

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.7.7
    container_name: kafka-connect
    hostname: kafka-connect
    depends_on:
      - zookeeper
      - broker
      - schema-registry
    ports:
      - '8083:8083'
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: compose-connect-group


      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status

      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'

      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"       # path ที่ Kafka Connect ใช้ scan หา connector plugins
    
    command:
      - bash
      - -c
      - |
          echo "Installing Debezium Postgres Connector"
          confluent-hub install --no-prompt debezium/debezium-connector-postgresql:latest
          echo "Starting Kafka Connect"
          exec /etc/confluent/docker/run
    networks:
      - default
    restart: always


  control-center:
    # Confluent Control Center: Web UI สำหรับมอนิเตอร์และจัดการ Kafka ecosystem
    image: confluentinc/cp-enterprise-control-center:7.7.7 # Docker image ของ Control Center
    hostname: control-center                           
    container_name: control-center                 
    depends_on:
      - broker                                  
      - schema-registry                       
      - kafka-connect                                       
    ports:
      - "9021:9021"                                  
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'      # Kafka broker ที่ Control Center ใช้เชื่อมต่อ
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: 'connect:8083' # Kafka Connect cluster ที่จะมอนิเตอร์
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"   # URL ของ Schema Registry
      CONTROL_CENTER_REPLICATION_FACTOR: 1                  # replication factor ของ internal topics
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1          # จำนวน partition ของ internal topics
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1 # partition ของ monitoring topics
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1                # replication factor ของ metrics topic
      PORT: 9021                                            # พอร์ตที่ Control Center เปิดใช้งาน
    networks:
      - default                                             # ใช้ Docker Compose default network
    restart: always  

  spark-master:
    image: spark-custom:3.5.1
    build:
      context: ./spark-image
      dockerfile: Dockerfile
    hostname: spark-master
    container_name: spark-master
    environment:
      <<: *env-aws
      SPARK_MODE: master                   # กำหนดบทบาทให้ container นี้เป็น Spark Master
      PYSPARK_PYTHON: python3              # Python ที่ใช้กับ PySpark (ทั้ง driver และ worker)
      PYSPARK_DRIVER_PYTHON: python3       # Python ที่ใช้เฉพาะฝั่ง driver
      SPARK_DRIVER_MEMORY: 1G              # หน่วยความจำของ Spark Driver (Master)
    command: 
      - /opt/spark/bin/spark-class                 # Docker เรียกไฟล์ spark-class (ตัว launcher ของ Spark)
      - org.apache.spark.deploy.master.Master      # รัน class จาก spark-class ( ระบุให้ Spark รันในบทบาท Master)
    ports:
      - '18080:8080' # Web UI
      - '7077:7077' # Master port
    volumes:
      - ./spark/jobs:/opt/spark/jobs     # โฟลเดอร์เก็บ Spark jobs / scripts
      - ./spark/data:/opt/spark/data     # โฟลเดอร์ข้อมูลที่ Spark ใช้งาน
    depends_on:
      - minio
    networks:
      - default
    restart: always

  spark-worker-1:
    image: spark-custom:3.5.1
    hostname: spark-worker-1
    container_name: spark-worker-1
    environment:
      <<: *env-aws
      SPARK_MODE: worker                 # ระบุบทบาทว่าเป็น Spark Worker
      SPARK_WORKER_MEMORY: 4G            # RAM ของ worker
      SPARK_WORKER_CORES: 4              # CPU core ของ worker
      PYSPARK_PYTHON: python3            # Python สำหรับ PySpark
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=3600"
    command:
      - /opt/spark/bin/spark-class        # ตัว launcher ของ Spark
      - org.apache.spark.deploy.worker.Worker # รันในบทบาท Worker
      - spark://spark-master:7077         # ที่อยู่ Spark Master
    volumes:
      - ./spark/jobs:/opt/spark/jobs     # แชร์ jobs เหมือน master
      - ./spark/data:/opt/spark/data     # แชร์ data
    networks:
      - default
    depends_on:
      - spark-master
      - minio
    restart: always

  spark-worker-2:
    image: spark-custom:3.5.1
    hostname: spark-worker-2
    container_name: spark-worker-2
    environment:
      <<: *env-aws
      SPARK_MODE: worker                 # ระบุบทบาทว่าเป็น Spark Worker
      SPARK_WORKER_MEMORY: 4G            # RAM ของ worker
      SPARK_WORKER_CORES: 4              # CPU core ของ worker
      PYSPARK_PYTHON: python3            # Python สำหรับ PySpark
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=3600"
    command:
      - /opt/spark/bin/spark-class        # ตัว launcher ของ Spark
      - org.apache.spark.deploy.worker.Worker # รันในบทบาท Worker
      - spark://spark-master:7077         # ที่อยู่ Spark Master
    volumes:
      - ./spark/jobs:/opt/spark/jobs     # แชร์ jobs เหมือน master
      - ./spark/data:/opt/spark/data     # แชร์ data
    networks:
      - default
    depends_on:
      - spark-master
      - minio
    restart: always

  # Spark job
  spark-bronze-customers:
    <<: *spark-bronze-common
    container_name: spark-bronze-customers
    hostname: spark-bronze-customers
    command: ["/opt/spark/entrypoint.sh", "customers"]

  spark-bronze-items:
    <<: *spark-bronze-common
    container_name: spark-bronze-items
    hostname: spark-bronze-items
    command: ["/opt/spark/entrypoint.sh", "items"]

  spark-bronze-orders:
    <<: *spark-bronze-common
    container_name: spark-bronze-orders
    hostname: spark-bronze-orders
    command: ["/opt/spark/entrypoint.sh", "orders"]

  spark-bronze-payments:
    <<: *spark-bronze-common
    container_name: spark-bronze-payments
    hostname: spark-bronze-payments
    command: ["/opt/spark/entrypoint.sh", "payments"]

  spark-bronze-shippings:
    <<: *spark-bronze-common
    container_name: spark-bronze-shippings
    hostname: spark-bronze-shippings
    command: ["/opt/spark/entrypoint.sh", "shippings"]

  postgres:
    image: postgres:15.15
    container_name: postgres-cdc-mel
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adm012345
      POSTGRES_DB: data
    ports:
      - '5432:5432'
    command: >
      postgres
      -c wal_level=logical          
      -c max_replication_slots=10     
      -c max_wal_senders=1
    volumes:
      - cdc_mel_pg_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z  
    container_name: minio-cdc-mel
    command:  server /data --console-address ":9001"      #รัน MinIO แบบ standalone ใช้ /data เก็บข้อมูล และเปิด Web Console ที่พอร์ต 9001
    ports:
      - '7000:9000'    # S3 API
      - '7001:9001'    # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - cdc_mel_minio_data:/data
    restart: always

  jupyter-pyspark:
    build:
      context: ./jupyter
      dockerfile: Dockerfile-jupyter
    container_name: jupyter-pyspark
    ports:
      - "8888:8888"
    environment:
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_MASTER: spark://spark-master:7077
    volumes:
      - ./notebooks:/opt/spark/work-dir
      - ./jupyter_config:/home/spark/.jupyter
    depends_on:
      - spark-master

  clickhouse:
    image: clickhouse:25.12.3.21
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"   # HTTP (web / BI / curl)
      - "19000:9000"  # TCP (app / client)
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1  # เปิดระบบจัดการ user/role
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144   # จำนวนไฟล์ที่เปิดได้พร้อมกัน (ชั่วคราว) -> เปิดไฟล์ได้สูงสุด 262,144 ไฟล์พร้อมกัน
        hard: 262144   # ค่าสูงสุดที่ระบบอนุญาต -> มกัน
    networks:
      - default
    restart: always

volumes:
  cdc_mel_pg_data:
  cdc_mel_minio_data:
  cdc_mel_kafka_data:
  clickhouse_data:
